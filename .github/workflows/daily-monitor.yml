name: OKGames.ph Daily Malware & Downtime Monitor

on:
  schedule:
    # Runs every day at 00:00 UTC (8:00 AM Philippine Time / PHT)
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      target_urls:
        description: "Comma-separated URLs to check (default: https://okgames.ph,https://www.okgames.ph)"
        required: false
        default: "https://okgames.ph,https://www.okgames.ph"
      skip_playwright:
        description: "Skip headless browser (Playwright) deep scan"
        required: false
        type: boolean
        default: false
      notify_always:
        description: "Send webhook notification even when all checks are healthy"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    name: Daily Uptime & Malware Check (OKGames.ph)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ "${{ inputs.skip_playwright }}" != "true" ]; then
            playwright install --with-deps chromium
          fi

      - name: Run OKGames.ph Uptime & Malware Monitor
        id: run_monitor
        continue-on-error: true
        env:
          MONITOR_TARGET_URLS: ${{ inputs.target_urls || 'https://okgames.ph,https://www.okgames.ph' }}
          MONITOR_PROXY_URL: ${{ secrets.MONITOR_PROXY_URL }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          GOOGLE_SAFE_BROWSING_API_KEY: ${{ secrets.GOOGLE_SAFE_BROWSING_API_KEY }}
          URLHAUS_AUTH_KEY: ${{ secrets.URLHAUS_AUTH_KEY }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID || '1quiLsHcrWb4JtKEGACsc4KVWBEGC0Nm9' }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ ! -d "okgames_monitor" ] && [ -f "cli.py" ]; then
            mkdir -p okgames_monitor
            cp __init__.py cli.py config.py http_client.py malware.py reporting.py uptime.py okgames_monitor/
          fi
          ARGS="--output-dir ./reports --upload-gdrive"
          if [ "${{ inputs.skip_playwright }}" = "true" ]; then
            ARGS="$ARGS --skip-playwright"
          fi
          if [ "${{ inputs.notify_always }}" = "true" ]; then
            ARGS="$ARGS --notify-always"
          fi
          python -m okgames_monitor.cli $ARGS

      - name: Upload Daily Reports & Playwright Screenshots Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okgames-daily-report-${{ github.run_number }}
          path: ./reports/
          retention-days: 90

      - name: Open or Update GitHub Issue on Alert (CRITICAL / WARNING)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportJsonPath = './reports/latest-report.json';
            const reportMdPath = './reports/latest-report.md';
            if (!fs.existsSync(reportJsonPath) || !fs.existsSync(reportMdPath)) {
              core.warning('Report files were not found; skipping issue automation.');
              return;
            }

            const report = JSON.parse(fs.readFileSync(reportJsonPath, 'utf8'));
            const markdownBody = fs.readFileSync(reportMdPath, 'utf8');
            const severity = report.overall_severity;
            const issueLabel = 'okgames-monitor-alert';

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: issueLabel,
              });
            } catch (e) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: issueLabel,
                color: 'd93f0b',
                description: 'Automated alert from OKGames.ph Daily Malware & Downtime Monitor',
              });
            }

            const openIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: issueLabel,
              per_page: 5,
            });

            if (severity === 'CRITICAL' || severity === 'WARNING') {
              const title = `[${severity}] OKGames.ph Monitor Alert — ${report.overall_summary} (${report.timestamp_pht})`;
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              const fullBody = `${markdownBody}\n\n---\n🔗 [View GitHub Actions Run & Screenshots](${runUrl})`;

              if (openIssues.data.length > 0) {
                const existing = openIssues.data[0];
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  title: title,
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: fullBody,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: title,
                  body: fullBody,
                  labels: [issueLabel],
                });
              }
            } else if (severity === 'OK' && openIssues.data.length > 0) {
              for (const issue of openIssues.data) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `🟢 **Recovered (${report.timestamp_pht})** — All uptime and malware checks are now passing.\n\n${markdownBody}`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
              }
            }

      - name: Fail job if monitor reported CRITICAL status
        if: steps.run_monitor.outcome == 'failure'
        run: |
          echo "OKGames.ph monitor detected a CRITICAL condition. Check the Job Summary and uploaded artifacts."
          exit 1
